version: '3'
services:
  mongodb:
    image: mongo
    ports:
      - "27017:27017"
    networks:
    - app-network

  app:
    build: .
    image: customerapp
    ports:
      - "3001:3001"
    depends_on:
      - mongodb
    networks:
      - app-network

networks:
  app-network:
    driver: bridge